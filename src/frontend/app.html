<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wavelength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="js/common.js"></script>
</head>
<body class="app">
<div class="shell">

  <!-- ============ LEFT: chat ============ -->
  <aside class="chat">
    <header class="chat-head">
      <a class="brand" href="app.html" aria-label="Wavelength">
        <span class="logo-crop"><img src="assets/logo.png" alt="Wavelength"
          onerror="this.parentNode.outerHTML='<span class=&quot;wordmark-text&quot;>Wavelength</span>'" /></span>
      </a>
      <div class="right">
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch between dark and light theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="profile-menu">
          <button class="icon-btn avatar" id="profile-icon-btn" type="button" aria-haspopup="true" aria-label="Account menu"><span id="avatar-letter">W</span></button>
          <div class="profile-dropdown" id="profile-dropdown">
            <div class="who"><b id="brand-name-display">Account</b><span id="email-display"></span></div>
            <a href="profile.html">Brand settings</a>
            <a href="history.html">History</a>
            <button id="logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="attachments" id="attachments"></div>
      <textarea id="prompt" rows="1" placeholder="What should we post about?" aria-label="Message"></textarea>
      <div class="composer-row">
        <button class="icon-btn" id="attach-btn" type="button" title="Add past posts as style examples (.txt, .md or .csv)" aria-label="Attach a file of past posts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
        </button>
        <input type="file" id="file-input" accept=".txt,.md,.csv,text/plain,text/markdown,text/csv" multiple hidden />
        <div class="seg" id="content-type" role="radiogroup" aria-label="Content type">
          <button type="button" data-type="caption" aria-pressed="true">Caption</button>
          <button type="button" data-type="notification" aria-pressed="false">Notification</button>
          <button type="button" data-type="meme" aria-pressed="false">Meme</button>
          <button type="button" data-type="email" aria-pressed="false">Email</button>
          <button type="button" data-type="newsletter" aria-pressed="false">Newsletter</button>
        </div>
        <button class="send" id="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </aside>

  <!-- ============ RIGHT: agent loop + results ============ -->
  <main class="stage-col">
    <section class="stage" id="stage">
      <div class="stage-top">
        <h2>Agent loop</h2>
        <span class="status" id="status" data-s="idle">Standing by</span>
      </div>
      <div class="loop-wrap">
        <svg id="loop" viewBox="0 0 900 290" role="img" aria-label="The steps the agent runs for every brief"></svg>
      </div>
      <div class="caption" id="caption" aria-live="polite">
        <h3 id="cap-title"></h3>
        <p id="cap-text"></p>
        <p class="cap-hint" id="cap-hint">Send a brief in the chat to run this for every state you promote in.</p>
      </div>
    </section>

    <section class="results" id="results" aria-label="Drafts by state"></section>
    <div class="note" id="pipeline-note"></div>
    <button class="btn-ghost" id="retry-generation" type="button" hidden>Retry last brief</button>

    <section class="email-section" id="email-section" hidden>
      <h2>Send an update</h2>
      <p class="sub">Turns your selected drafts into one email for you to review.</p>
      <button class="btn-ghost" id="draft-email-btn" type="button">Draft email from selected taglines</button>

      <div class="email-draft-box" id="email-draft-box" hidden style="margin-top:16px">
        <div class="field">
          <label for="email-subject">Subject</label>
          <input id="email-subject" />
        </div>
        <div class="field">
          <label for="email-body">Body</label>
          <textarea id="email-body" rows="8"></textarea>
        </div>
        <div class="inline-note" id="email-draft-note"></div>
        <button class="btn" id="send-email-btn" type="button">Approve &amp; send</button>
        <div class="inline-note" id="email-send-note"></div>
      </div>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
