<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wavelength — Business profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="js/common.js"></script>
</head>
<body>
  <div class="page">
    <div class="page-head">
      <a class="brand" href="index.html" aria-label="Wavelength">
        <span class="logo-crop"><img src="assets/logo.png" alt="Wavelength"
          onerror="this.parentNode.outerHTML='<span class=&quot;wordmark-text&quot;>Wavelength</span>'" /></span>
      </a>
      <div class="right">
        <a class="btn-ghost" id="back-link" href="app.html" style="text-decoration:none" hidden>Back to chat</a>
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch between dark and light theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>

    <h1 id="page-heading">Business settings</h1>
    <p class="sub" id="page-sub">Wavelength uses this to write in your voice for each state.</p>

    <form id="profile-form" novalidate>
      <div class="field" data-field="business_name">
        <label for="business_name">Business name</label>
        <input id="business_name" maxlength="80" />
        <div class="field-msg"></div>
      </div>
      <div class="row-2">
        <div class="field" data-field="industry">
          <label for="industry">Industry</label>
          <input id="industry" maxlength="80" placeholder="e.g. coffee shop" />
          <div class="field-msg"></div>
        </div>
        <div class="field" data-field="tone">
          <label for="tone">Brand tone</label>
          <input id="tone" maxlength="80" placeholder="e.g. playful, premium" />
          <div class="field-msg"></div>
        </div>
      </div>

      <div class="field" data-field="states">
        <label>States to promote in</label>
        <div id="states-container" class="states-grid"></div>
        <div class="field-msg" id="states-msg"></div>
      </div>

      <div class="field">
        <label for="past_taglines">Past posts (one per line, optional)</label>
        <textarea id="past_taglines" rows="5" placeholder="Paste a few captions you've used before, one per line. You can also drop a file into the chat later."></textarea>
      </div>

      <div class="form-error" id="profile-error" role="alert"></div>
      <button class="btn" id="save-btn" type="submit">Save changes</button>
    </form>
  </div>

  <script src="js/profile.js"></script>
</body>
</html>
