<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projects · Wavelength</title><link rel="stylesheet" href="styles.css"><script src="js/common.js"></script></head>
<body class="projects-page">
<header class="projects-nav"><a class="brand projects-brand" href="projects.html" aria-label="Wavelength workspace"><span class="logo-crop"><img src="assets/logo.png" alt="Wavelength" onerror="this.parentNode.outerHTML='<span class=&quot;wordmark-text&quot;>Wavelength</span>'" /></span><span class="project-eyebrow">Workspace</span></a><nav><button class="btn-ghost theme-toggle" type="button">Toggle theme</button><a href="profile.html">Brand settings</a><button class="btn-ghost" id="logout" type="button">Log out</button></nav></header>
<main class="projects-main"><div class="projects-heading"><div><span class="project-eyebrow">YOUR CREATIVE WORKSPACE</span><h1>All your projects.</h1><p>A place for every idea. Pick up where you left off, or start something new.</p></div><button class="btn" id="new-project">+ New project</button></div><p id="projects-error" role="alert"></p><div id="projects-grid" class="projects-grid" aria-live="polite">Loading projects…</div></main>
<dialog id="new-dialog" class="project-dialog"><form id="new-form"><div class="projects-heading"><h2>Start a new project</h2><button type="button" class="btn-ghost" id="close-dialog" aria-label="Close">✕</button></div><p>Give your next idea a home.</p><div class="field"><label for="project-name">Project name</label><input id="project-name" required maxlength="120" placeholder="e.g. Fall collection launch"></div><label class="upload-zone" for="project-files"><strong>＋ Add your reference files</strong><span>Briefs, documentation, brand assets — optional.</span><small>Up to 6 MB total. Files are saved in your project library.</small><input type="file" id="project-files" multiple></label><div id="file-list"></div><p id="create-error" role="alert"></p><button type="submit" class="btn" id="create-project">Create project &amp; open chat →</button></form></dialog>
<dialog id="library-dialog" class="project-dialog"><div class="projects-heading"><h2 id="library-title">Project library</h2><button class="btn-ghost" id="close-library" aria-label="Close">✕</button></div><div id="library-items"></div></dialog>
<script src="js/projects.js"></script></body></html>
